<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리 운동 체크</title>
<style>
:root{--bg:#fff6ee;--card:#ffffff;--ink:#1f1a17;--sub:#7a6e66;--line:#f0e2d6;--hero1:#ff5a1f;--hero2:#ffa11f;--shadow:0 4px 16px rgba(120,60,20,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120f;--card:#241d18;--ink:#fbf1e8;--sub:#b3a398;--line:#382d25;--shadow:0 4px 16px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#17120f;--card:#241d18;--ink:#fbf1e8;--sub:#b3a398;--line:#382d25;--shadow:0 4px 16px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;max-width:520px;margin:0 auto;padding-bottom:92px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:22px 20px 26px;border-radius:0 0 28px 28px}
.hero h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.5px}
.hero p{margin:4px 0 0;opacity:.92;font-size:14px}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:rgba(255,255,255,.2);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;opacity:.95}
main{padding:16px}
.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:6px;box-shadow:var(--shadow);margin-bottom:14px}
.datebar button{width:46px;height:46px;border-radius:14px;font-size:20px;font-weight:800}
.datebar button:active{background:var(--line)}
.dlabel{text-align:center;flex:1}
.dlabel b{font-size:17px;font-weight:800;display:block}
.dlabel small{color:var(--sub);font-size:12px}
.today{display:inline-block;margin-bottom:12px;padding:6px 14px;border-radius:99px;background:var(--line);font-size:13px;font-weight:700}
.card{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);border-left:6px solid var(--c)}
.row{display:flex;align-items:center;justify-content:space-between}
.name{font-size:17px;font-weight:800}
.name i{font-style:normal;margin-right:6px}
.done{font-size:12px;font-weight:800;color:var(--c);opacity:0}
.card.on .done{opacity:1}
.ctl{display:flex;align-items:center;gap:8px;margin-top:12px}
.step{width:52px;height:52px;border-radius:16px;background:var(--line);font-size:26px;font-weight:800}
.step:active{transform:scale(.94)}
.ctl input{flex:1;min-width:0;height:52px;border:2px solid var(--line);border-radius:16px;background:transparent;color:var(--ink);text-align:center;font-size:26px;font-weight:900;font-family:inherit}
.ctl input:focus{outline:none;border-color:var(--c)}
.chips{display:flex;gap:8px;margin-top:10px}
.chip{flex:1;padding:9px 0;border-radius:12px;background:var(--c);color:#fff;font-weight:800;font-size:14px}
.chip:active{transform:scale(.95)}
.chip.ghost{background:var(--line);color:var(--sub)}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.nav button{flex:1;height:52px;border-radius:16px;font-weight:800;font-size:16px;background:var(--card);box-shadow:var(--shadow)}
.nav button.act{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.seg button{flex:1;white-space:nowrap;padding:10px 12px;border-radius:99px;background:var(--card);font-weight:800;font-size:14px;box-shadow:var(--shadow)}
.seg button.act{background:var(--c);color:#fff}
.chart{background:var(--card);border-radius:22px;padding:14px 10px 8px;box-shadow:var(--shadow);margin-bottom:12px}
.chart h3{margin:0 8px 4px;font-size:15px}
.chart svg{width:100%;height:auto;display:block}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot div{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border-left:6px solid var(--c)}
.tot b{display:block;font-size:22px;font-weight:900}
.tot span{font-size:12px;color:var(--sub)}
.hint{color:var(--sub);font-size:12px;text-align:center;margin:10px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#1f1a17;color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.hide{display:none}
</style>
</head>
<body>
<div class="hero">
  <h1>🔥 오늘도 운동 완료!</h1>
  <p id="msg">오늘의 목표를 채워보세요</p>
  <div class="stats">
    <div class="stat"><b id="sStreak">0</b><span>연속 운동일</span></div>
    <div class="stat"><b id="sMonth">0</b><span>이번 달 운동일</span></div>
    <div class="stat"><b id="sAll">0</b><span>전체 기록일</span></div>
  </div>
</div>
<main>
  <section id="vRec">
    <div class="datebar">
      <button id="prev" aria-label="이전 날">◀</button>
      <div class="dlabel"><b id="dTxt"></b><small id="dSub"></small></div>
      <button id="next" aria-label="다음 날">▶</button>
    </div>
    <div style="text-align:center"><button class="today" id="goToday">오늘로 이동</button></div>
    <div id="cards"></div>
  </section>
  <section id="vMon" class="hide">
    <div class="datebar">
      <button id="mPrev" aria-label="이전 달">◀</button>
      <div class="dlabel"><b id="mTxt"></b><small id="mSub"></small></div>
      <button id="mNext" aria-label="다음 달">▶</button>
    </div>
    <div class="seg" id="seg"></div>
    <div class="chart"><h3 id="cTitle"></h3><div id="chart"></div></div>
    <div class="tot" id="tot"></div>
    <p class="hint">막대를 누르면 그 날 기록으로 이동해요</p>
  </section>
</main>
<div class="nav">
  <button id="tRec" class="act">✅ 오늘 기록</button>
  <button id="tMon">📊 월별 그래프</button>
</div>
<div class="toast" id="toast">저장됨</div>
<script>
const EX=[
 {k:'pu',n:'팔굽혀펴기',e:'💪',c:'#ff5a1f',chips:[5,10]},
 {k:'pl',n:'턱걸이',e:'🧗',c:'#1f9bff',chips:[1,5]},
 {k:'hs',n:'기마자세',e:'🏇',c:'#21b36b',chips:[5,10]},
 {k:'tw',n:'허리 돌리기',e:'🌀',c:'#a855f7',chips:[10,20]}
];
const KEY='workout-tracker-v1';
let data={};
try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const DOW=['일','월','화','수','목','금','토'];
const todayStr=()=>fmt(new Date());
let cur=todayStr(), sel='pu', mon=new Date(); mon.setDate(1);

function val(d,k){return (data[d]&&data[d][k])||0}
function setVal(d,k,v){
  v=Math.max(0,Math.min(99999,Math.floor(v)||0));
  if(!data[d])data[d]={};
  if(v===0){delete data[d][k];if(!Object.keys(data[d]).length)delete data[d]}else data[d][k]=v;
  save();
}
function hasAny(d){return !!data[d]}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),900)}

function renderStats(){
  let s=0,d=new Date();
  if(!hasAny(fmt(d)))d.setDate(d.getDate()-1);
  while(hasAny(fmt(d))){s++;d.setDate(d.getDate()-1)}
  $('sStreak').textContent=s;
  const m=new Date();const pre=m.getFullYear()+'-'+pad(m.getMonth()+1);
  $('sMonth').textContent=Object.keys(data).filter(k=>k.startsWith(pre)).length;
  $('sAll').textContent=Object.keys(data).length;
  $('msg').textContent=hasAny(todayStr())?'오늘 기록 완료! 내일도 이어가요 💥':'오늘의 목표를 채워보세요';
}

function renderRec(){
  const d=parse(cur);
  $('dTxt').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')';
  $('dSub').textContent=d.getFullYear()+'년'+(cur===todayStr()?' · 오늘':'');
  $('goToday').style.display=cur===todayStr()?'none':'inline-block';
  $('next').style.visibility=cur>=todayStr()?'hidden':'visible';
  $('cards').innerHTML=EX.map(x=>{
    const v=val(cur,x.k);
    return `<div class="card ${v?'on':''}" style="--c:${x.c}" data-k="${x.k}">
      <div class="row"><div class="name"><i>${x.e}</i>${x.n}</div><div class="done">✔ 완료</div></div>
      <div class="ctl">
        <button class="step" data-a="-1" aria-label="${x.n} 1 감소">−</button>
        <input type="number" inputmode="numeric" min="0" placeholder="0" value="${v||''}" aria-label="${x.n} 횟수">
        <button class="step" data-a="1" aria-label="${x.n} 1 증가">+</button>
      </div>
      <div class="chips">
        <button class="chip" data-a="${x.chips[0]}">+${x.chips[0]}</button>
        <button class="chip" data-a="${x.chips[1]}">+${x.chips[1]}</button>
        <button class="chip ghost" data-a="reset">초기화</button>
      </div>
    </div>`}).join('');
  renderStats();
}

$('cards').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const card=b.closest('.card'),k=card.dataset.k,a=b.dataset.a;
  const nv=a==='reset'?0:val(cur,k)+Number(a);
  setVal(cur,k,nv);
  const v=val(cur,k);
  card.querySelector('input').value=v||'';
  card.classList.toggle('on',v>0);
  renderStats();toast('저장됨 ✔');
});
$('cards').addEventListener('input',e=>{
  if(e.target.tagName!=='INPUT')return;
  const card=e.target.closest('.card');
  setVal(cur,card.dataset.k,Number(e.target.value));
  card.classList.toggle('on',val(cur,card.dataset.k)>0);
  renderStats();toast('저장됨 ✔');
});
$('prev').onclick=()=>{const d=parse(cur);d.setDate(d.getDate()-1);cur=fmt(d);renderRec()};
$('next').onclick=()=>{const d=parse(cur);d.setDate(d.getDate()+1);if(fmt(d)<=todayStr()){cur=fmt(d);renderRec()}};
$('goToday').onclick=()=>{cur=todayStr();renderRec()};

function renderMon(){
  const y=mon.getFullYear(),m=mon.getMonth(),N=new Date(y,m+1,0).getDate();
  const pre=y+'-'+pad(m+1)+'-';
  $('mTxt').textContent=y+'년 '+(m+1)+'월';
  const days=Object.keys(data).filter(k=>k.startsWith(pre)).length;
  $('mSub').textContent='운동한 날 '+days+'일';
  const x=EX.find(e=>e.k===sel);
  $('seg').innerHTML=EX.map(e=>`<button data-k="${e.k}" class="${e.k===sel?'act':''}" style="--c:${e.c}">${e.e} ${e.n}</button>`).join('');
  $('cTitle').textContent=x.n+' · 일별 기록';
  const vals=[];for(let i=1;i<=N;i++)vals.push(val(pre+pad(i),sel));
  const mx=Math.max(...vals,0);
  const top=mx<=5?5:Math.ceil(mx/ (mx>50?10:5))*(mx>50?10:5);
  const W=340,H=190,L=30,R=6,T=14,B=24,pw=W-L-R,ph=H-T-B,bw=pw/N;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${x.n} 월별 그래프">`;
  for(let g=0;g<=3;g++){
    const yy=T+ph-ph*g/3,lab=Math.round(top*g/3);
    s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${yy+4}" font-size="10" text-anchor="end" fill="var(--sub)">${lab}</text>`;
  }
  vals.forEach((v,i)=>{
    const d=i+1,bx=L+i*bw+bw*.15,w=bw*.7,h=v?Math.max(3,ph*v/top):0,date=pre+pad(d);
    s+=`<rect data-d="${date}" x="${L+i*bw}" y="${T}" width="${bw}" height="${ph+B}" fill="transparent"/>`;
    if(v)s+=`<rect x="${bx}" y="${T+ph-h}" width="${w}" height="${h}" rx="${Math.min(3,w/2)}" fill="${x.c}" pointer-events="none"/>`;
    if(v&&v===mx&&N<=31)s+=`<text x="${bx+w/2}" y="${T+ph-h-3}" font-size="10" font-weight="800" text-anchor="middle" fill="${x.c}" pointer-events="none">${v}</text>`;
    if(d===1||d%5===0)s+=`<text x="${bx+w/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--sub)" pointer-events="none">${d}</text>`;
  });
  $('chart').innerHTML=s+'</svg>';
  $('tot').innerHTML=EX.map(e=>{
    let t=0,mxx=0;for(let i=1;i<=N;i++){const v=val(pre+pad(i),e.k);t+=v;mxx=Math.max(mxx,v)}
    return `<div style="--c:${e.c}"><span>${e.e} ${e.n} 합계</span><b>${t.toLocaleString()}회</b><span>하루 최고 ${mxx}회</span></div>`}).join('');
}
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){sel=b.dataset.k;renderMon()}});
$('chart').addEventListener('click',e=>{const r=e.target.closest('rect[data-d]');if(r){cur=r.dataset.d;tab('rec')}});
$('mPrev').onclick=()=>{mon.setMonth(mon.getMonth()-1);renderMon()};
$('mNext').onclick=()=>{mon.setMonth(mon.getMonth()+1);renderMon()};

function tab(t){
  const rec=t==='rec';
  $('vRec').classList.toggle('hide',!rec);$('vMon').classList.toggle('hide',rec);
  $('tRec').classList.toggle('act',rec);$('tMon').classList.toggle('act',!rec);
  if(rec)renderRec();else renderMon();
  window.scrollTo(0,0);
}
$('tRec').onclick=()=>tab('rec');
$('tMon').onclick=()=>tab('mon');
renderRec();
</script>
</body>
</html>
